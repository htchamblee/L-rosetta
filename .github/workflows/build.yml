name: Build Rosetta

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Rosetta build directory
        uses: actions/cache@v6
        with:
          # .sconsign.dblite holds the signatures scons uses to decide what is
          # up to date.  Without it a restored build/ is rebuilt from scratch.
          path: |
            source/build
            source/.sconsign.dblite
          key: ${{ runner.os }}-rosetta-build-${{ hashFiles('source/**/*.cc', 'source/**/*.hh', 'source/**/*.cpp', 'source/**/*.h', 'source/SConstruct', 'source/**/SConscript') }}
          restore-keys: |
            ${{ runner.os }}-rosetta-build-

      - name: Build Rosetta inside a container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/rosetta" \
            -w /rosetta/source \
            ubuntu:22.04 \
            bash -c '
              apt-get update && \
              apt-get install -y build-essential python3 python3-dev zlib1g-dev && \
              python3 ./scons.py -j4 mode=release rna_denovo
            '
